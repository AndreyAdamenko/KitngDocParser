[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitng-doc-parser"
version = "1.0.0"
description = "Универсальный конвейер парсинга инженерных и управленческих документов в Markdown для MCP-серверов KITNG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "KITNG AI Team" }]
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
